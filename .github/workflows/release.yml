name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Check formatting
        run: cargo fmt --all -- --check

  package:
    name: Package ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@cross
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Create archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          package="tcp-brutal-auto-${VERSION}-${TARGET}"
          mkdir -p "$package"
          install -Dm755 "target/${TARGET}/release/tcp-brutal-auto" "$package/tcp-brutal-auto"
          install -Dm644 packaging/tcp-brutal-auto.service "$package/tcp-brutal-auto.service"
          install -Dm644 packaging/whitelist.example "$package/whitelist.example"
          install -Dm644 data/china-mainland-ipv4.txt "$package/china-mainland-ipv4.txt"
          install -Dm644 README.md "$package/README.md"
          tar -czf "${package}.tar.gz" "$package"
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            tcp-brutal-auto-*.tar.gz
            tcp-brutal-auto-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
